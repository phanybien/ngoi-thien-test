<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngồi Thiền Cùng Nhau</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Lớp phủ hình nền hồ nước và rừng cây */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Hình ảnh hồ nước và rừng cây từ Unsplash */
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* Lớp phủ tối màu để làm nổi bật chữ và vòng tròn thiền */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Vòng tròn hít thở */
        .meditation-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 2rem auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            transition: transform 4s ease-in-out;
        }

        .meditation-circle.inhale {
            transform: scale(1.25);
            background: rgba(255, 255, 255, 0.25);
        }

        .meditation-circle.exhale {
            transform: scale(1);
            background: rgba(255, 255, 255, 0.15);
        }

        #status-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        #timer {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* Nút bấm điều khiển */
        .btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Khung hình nền và lớp phủ -->
    <div class="bg-container"></div>
    <div class="overlay"></div>

    <div class="container">
        <h1>Thở & Kết Nối Nội Tâm</h1>

        <div class="meditation-circle" id="circle">
            <div id="status-text">Bấm Bắt Đầu</div>
            <div id="timer">00:00</div>
        </div>

        <button class="btn" id="start-btn" onclick="toggleMeditation()">Bắt Đầu Thiền</button>
    </div>

    <script>
        let isRunning = false;
        let timerInterval = null;
        let totalSeconds = 0;
        let breathInterval = null;

        const circle = document.getElementById('circle');
        const statusText = document.getElementById('status-text');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function runBreathCycle() {
            // Hít vào (4 giây)
            statusText.innerText = "Hít Vào...";
            circle.className = "meditation-circle inhale";

            setTimeout(() => {
                if (!isRunning) return;
                // Thở ra (4 giây)
                statusText.innerText = "Thở Ra...";
                circle.className = "meditation-circle exhale";
            }, 4000);
        }

        function toggleMeditation() {
            if (!isRunning) {
                // Bắt đầu
                isRunning = true;
                startBtn.innerText = "Kết Thúc";
                totalSeconds = 0;
                timerDisplay.innerText = formatTime(totalSeconds);

                // Đồng hồ đếm thời gian thiền
                timerInterval = setInterval(() => {
                    totalSeconds++;
                    timerDisplay.innerText = formatTime(totalSeconds);
                }, 1000);

                // Chạy chu kỳ hít thở ngay lập tức và lặp lại mỗi 8 giây
                runBreathCycle();
                breathInterval = setInterval(runBreathCycle, 8000);

            } else {
                // Dừng lại
                isRunning = false;
                startBtn.innerText = "Bắt Đầu Thiền";
                clearInterval(timerInterval);
                clearInterval(breathInterval);

                statusText.innerText = "Đã hoàn thành";
                circle.className = "meditation-circle";
                setTimeout(() => {
                    statusText.innerText = "Bấm Bắt Đầu";
                }, 2000);
            }
        }
    </script>
</body>
</html>
